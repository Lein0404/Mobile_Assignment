<!DOCTYPE html>
<html>
<head>
    <title>Foodie Heal - Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #1a1a1a; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #message { margin-top: 1rem; font-size: 0.9rem; font-weight: bold; }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Foodie Heal</h1>
        <p>Enter your new password below to reset your account.</p>

        <input type="password" id="new-password" placeholder="New Password (min 6 chars)">
        <input type="password" id="confirm-password" placeholder="Confirm New Password">

        <button id="submit-btn">Update Password</button>
        <div id="message"></div>

        <p id="app-link" style="display:none; margin-top: 1.5rem;">
            Password updated! You can now <a href="foodieheal://reset" style="color: #4CAF50; font-weight: bold;">Open the App</a> to login.
        </p>
    </div>

    <script>
        // REPLACE THESE with your actual keys from SupabaseClient.kt
        const SUPABASE_URL = "https://gamlgwljbicaanomazvz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_NHNRwxkgEzo4V-dgDokkKw_WbrTkrQr";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');

        submitBtn.onclick = async () => {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.", "error");
                return;
            }
            if (password !== confirm) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Updating...";

            // Supabase automatically picks up the 'access_token' from the URL hash
            const { error } = await supabaseClient.auth.updateUser({ password: password });

            if (error) {
                showMessage("Error: " + error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerText = "Update Password";
            } else {
                showMessage("Password updated successfully!", "success");
                submitBtn.style.display = "none";
                document.getElementById('app-link').style.display = "block";
            }
        };

        function showMessage(text, type) {
            messageDiv.innerText = text;
            messageDiv.className = type;
        }
    </script>
</body>
</html>
